<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Pastelaria do Zé - Arquitetura Limpa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🍴 Sistema de Pedidos</h1>

  <div class="form">
    <select id="produto">
      <option value="pastel">Pastel - R$ 5,00</option>
      <option value="caldo">Caldo - R$ 7,00</option>
      <option value="refrigerante">Refrigerante - R$ 4,00</option>
      <option value="suco">Suco - R$ 6,00</option>
    </select>
    <input type="number" id="qtd" placeholder="Quantidade" min="1">
    
    <button id="btn-adicionar">Adicionar</button>
    <button id="btn-finalizar">Finalizar Pedido</button>
  </div>

  <div class="lista">
    <h2>Itens</h2>
    <ul id="lista"></ul>
  </div>

  <div class="total">
    <h2>Total: R$ <span id="total">0.00</span></h2>
  </div>
</div>

<script type="module" src="./src/controllers/app.js"></script>

<!-- para testar no console do navegador descomente -->
<script type="module" src="./src/testes.js"></script>

</body>
</html>
